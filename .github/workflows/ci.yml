name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:alpine3.20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgress
          POSTGRES_DB: sync_server_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # config.json is gitignored; create it from sample so module imports don't fail.
      # Tests use config.test.json via Vitest aliases, but source-level imports at module
      # load time (e.g. authorization.ts: `export const useJWT = ...`) need the file to exist.
      - run: cp config_sample.json config.json

      - run: npm run lint
        continue-on-error: true

      - run: npm test
        env:
          NODE_ENV: test

      - run: npx tsc --noEmit
